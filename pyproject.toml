[project]
name = "readeck-mcp"
version = "0.1.0"
description = "MCP server for a Readeck instance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
readeck-mcp = "readeck_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
venvPath = "."
venv = ".venv"
